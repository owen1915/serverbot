name: mc-watch

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 min; GitHub may delay to ~10-15 min
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write # to commit mcbot_state.json back

concurrency:
  group: mc-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MC_WEEKLY_WEBHOOK_URL: ${{ secrets.MC_WEEKLY_WEBHOOK_URL }}
          MC_LOG_WEBHOOK_URL: ${{ secrets.MC_LOG_WEBHOOK_URL }}
          # Weekly reset day boundaries follow this timezone, not UTC.
          TZ: America/New_York
          # Runs arrive 5-20 min apart due to cron jitter; raise the accrual
          # cap (2x this value) so real gaps are fully credited.
          MC_POLL_SECONDS: "900"
        run: python3 mcbot.py --once

      - name: Save state
        run: |
          git config user.name "mc-watch"
          git config user.email "actions@users.noreply.github.com"
          git add mcbot_state.json
          git diff --cached --quiet || { git commit -m "update state"; git push; }
